<!-- ============================================================
     JanSetu Assistant — floating AI citizen-support chatbot
     Closed: small circular gradient button (bottom-right).
     Open:   glassmorphism chat panel with quick questions,
             typing indicator, live complaint-status lookup.
     ============================================================ -->
<div id="chatbot-root" class="chatbot-root">

  <!-- Floating launcher (only visible thing when closed) -->
  <button
    id="chatbot-toggle"
    class="chatbot-toggle"
    type="button"
    aria-label="Open JanSetu Assistant"
    aria-haspopup="dialog"
    aria-controls="chatbot-panel"
    aria-expanded="false"
  >
    <span class="chatbot-toggle-icon" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        <path d="M8 11h.01M12 11h.01M16 11h.01"/>
      </svg>
    </span>
    <span class="chatbot-ping" aria-hidden="true"></span>
  </button>

  <!-- Chat panel -->
  <section
    id="chatbot-panel"
    class="chatbot-panel"
    role="dialog"
    aria-label="JanSetu Assistant"
    aria-hidden="true"
  >
    <!-- Header -->
    <header class="chatbot-head">
      <span class="chatbot-head-avatar" aria-hidden="true">🤖</span>
      <div class="chatbot-head-text">
        <strong data-chat-i18n="chatbot_title">JanSetu Assistant</strong>
        <small data-chat-i18n="chatbot_subtitle">AI Citizen Support</small>
      </div>
      <button
        id="chatbot-close"
        class="chatbot-close"
        type="button"
        aria-label="Close assistant"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </header>

    <!-- Messages -->
    <div id="chatbot-messages" class="chatbot-messages" role="log" aria-live="polite"></div>

    <!-- Typing indicator -->
    <div id="chatbot-typing" class="chatbot-typing hidden" aria-hidden="true">
      <span class="chatbot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span data-chat-i18n="chatbot_typing">JanSetu Assistant is typing…</span>
    </div>

    <!-- Input -->
    <footer class="chatbot-inputbar">
      <input
        id="chatbot-input"
        class="chatbot-input"
        type="text"
        placeholder="Ask JanSetu Assistant…"
        autocomplete="off"
        maxlength="2000"
        aria-label="Ask JanSetu Assistant"
      />
      <span id="chatbot-vt" class="chatbot-vt hidden" aria-hidden="true">00:00</span>
      <button
        id="chatbot-mic"
        class="chatbot-mic"
        type="button"
        aria-label="Voice input"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <path d="M12 19v4"/>
        </svg>
      </button>
      <button
        id="chatbot-send"
        class="chatbot-send"
        type="button"
        aria-label="Send message"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4 20-7z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>
    </footer>
  </section>
</div>
