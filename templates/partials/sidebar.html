{% load static %}
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <img src="{% static 'logo.png' %}" alt="JanSetu Logo" class="brand-logo-img">
      </span>
      <span class="brand-name">Jan<span>Setu</span></span>
    </a>
    <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-x"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <!-- Role dashboard link — href resolved by common.js from the stored user -->
    <a href="/dashboard/" id="sidebar-dashboard-link" class="sidebar-link">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-home"/></svg>
      <span data-i18n="dashboard">Dashboard</span>
    </a>

    <!-- Role-specific shortcuts (shown only for the matching role) -->
    <button class="sidebar-link" data-role="citizen" data-scroll="#submit-section">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-plus"/></svg>
      <span data-i18n="submit_complaint">Submit Complaint</span>
    </button>
    <button class="sidebar-link" data-role="citizen" data-scroll="#my-complaints">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-clipboard"/></svg>
      <span data-i18n="my_complaints">My Complaints</span>
    </button>
    <button class="sidebar-link" data-role="validator" data-scroll="#pending-list">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-clock"/></svg>
      <span data-i18n="pending_validation">Pending Validation</span>
    </button>
    <button class="sidebar-link" data-role="official" data-scroll="#complaint-list">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-clipboard"/></svg>
      <span data-i18n="complaints">Complaints</span>
    </button>

    <!-- Super Admin shortcuts -->
    <a href="/admin/applications/" class="sidebar-link" data-role="super_admin">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-doc"/></svg>
      <span data-i18n="admin_applications">Applications</span>
    </a>
    <a href="/admin/users/" class="sidebar-link" data-role="super_admin">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-user"/></svg>
      <span data-i18n="admin_users">Users</span>
    </a>
    <a href="/admin/complaints/" class="sidebar-link" data-role="super_admin">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-clipboard"/></svg>
      <span data-i18n="admin_complaints">Complaints</span>
    </a>
    <a href="/admin/reports/" class="sidebar-link" data-role="super_admin">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-workflow"/></svg>
      <span data-i18n="admin_reports">Reports</span>
    </a>
    <a href="/admin/audit/" class="sidebar-link" data-role="super_admin">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-shield"/></svg>
      <span data-i18n="admin_audit">Audit Log</span>
    </a>

    <a href="/profile/" class="sidebar-link">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-user"/></svg>
      <span data-i18n="profile">Profile</span>
    </a>
    <a href="/settings/" class="sidebar-link">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-gear"/></svg>
      <span data-i18n="settings">Settings</span>
    </a>
  </nav>

  <div class="sidebar-foot">
    <button class="sidebar-link" id="logout-btn">
      <svg class="icon"><use href="{% static 'icons.svg' %}#icon-logout"/></svg>
      <span data-i18n="logout">Logout</span>
    </button>
  </div>
</aside>
<div class="sidebar-scrim" id="sidebar-scrim"></div>
